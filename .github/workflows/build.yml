name: Build and test

on:
  pull_request:
    branches: [nightly, main]
  push:
    branches: [nightly]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 27 SDK needed (FoundationModels, ProcessStopper clock APIs); macos-26 ships 26.6.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      SWIFT_ENABLE_EXPLICIT_MODULES: "NO"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          swift --version

      # Release first: a debug-only symbol used by shipping code fails only here.
      - name: Release build
        run: swift build -c release

      - name: Debug build
        run: swift build

      - name: Tests
        env:
          CFFIXED_USER_HOME: ${{ runner.temp }}/portside-tests
        run: |
          mkdir -p "$CFFIXED_USER_HOME"
          swift test
