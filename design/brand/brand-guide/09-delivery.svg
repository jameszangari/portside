<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="iconNavy" x1=".05" y1="0" x2=".95" y2="1"><stop stop-color="#20465F"/><stop offset=".6" stop-color="#10283F"/><stop offset="1" stop-color="#071E30"/></linearGradient>
<linearGradient id="wall" x1="0" x2="1" y1=".14" y2=".88"><stop stop-color="#2F5A88"/><stop offset=".45" stop-color="#6285B7"/><stop offset=".85" stop-color="#DAA38D"/><stop offset="1" stop-color="#E4C5AB"/></linearGradient>
<linearGradient id="darkWall" x1=".25" x2=".9" y1="0" y2="1"><stop stop-color="#1F446B"/><stop offset=".6" stop-color="#071E30"/><stop offset="1" stop-color="#33536A"/></linearGradient>
<linearGradient id="dockGlass" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#F3F5F8" stop-opacity=".53"/><stop offset="1" stop-color="#D6E0EB" stop-opacity=".4"/></linearGradient>
