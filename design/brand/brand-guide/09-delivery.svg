<filter id="floating" x="-25%" y="-25%" width="170%" height="170%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="soft" x="-25%" y="-25%" width="170%" height="170%"><feGaussianBlur stdDeviation="10"/></filter></defs><rect width="1600" height="900" fill="#F8F6F1"/><text x="88" y="91" font-family="Inter Display, Inter, sans-serif" font-size="19" font-weight="600" fill="#F06A42" opacity="1" letter-spacing="3">08 / IMPLEMENTATION</text><text x="88" y="172" font-family="Inter Display, Inter, sans-serif" font-size="68" font-weight="650" fill="#132A3D" opacity="1" letter-spacing="-2">Ready for an Xcode project.</text><text x="90" y="222" font-family="Inter Display, Inter, sans-serif" font-size="24" font-weight="400" fill="#687887" opacity="1">Scalable sources, multi-size raster exports, and a layered Icon Composer bundle.</text><rect x="86" y="267" width="708" height="503" rx="23" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="125" y="325" font-family="Inter Display, Inter, sans-serif" font-size="32" font-weight="650" fill="#132A3D" opacity="1">Master assets</text><text x="128" y="390" font-family="Inter Display, Inter, sans-serif" font-size="22" font-weight="400" fill="#132A3D" opacity="1">Editable SVG shapes with separate sail + hull paths</text><text x="128" y="447" font-family="Inter Display, Inter, sans-serif" font-size="22" font-weight="400" fill="#132A3D" opacity="1">PNG exports at 16 / 32 / 48 / 64 / 128 / 256 / 512 / 1024</text><text x="128" y="504" font-family="Inter Display, Inter, sans-serif" font-size="22" font-weight="400" fill="#132A3D" opacity="1">Dark, light, and accent icon variants</text><text x="128" y="561" font-family="Inter Display, Inter, sans-serif" font-size="22" font-weight="400" fill="#132A3D" opacity="1">Horizontal and stacked wordmarks</text><text x="128" y="618" font-family="Inter Display, Inter, sans-serif" font-size="22" font-weight="400" fill="#132A3D" opacity="1">Monochrome status bar icons</text><text x="128" y="675" font-family="Inter Display, Inter, sans-serif" font-size="22" font-weight="400" fill="#132A3D" opacity="1">Native .icns fallback</text><rect x="829" y="267" width="681" height="503" rx="23" fill="#071E30" stroke="none" stroke-width="1"/><text x="863" y="329" font-family="Inter Display, Inter, sans-serif" font-size="32" font-weight="650" fill="#F4EEDF" opacity="1">Icon Composer</text><text x="861" y="380" font-family="Inter Display, Inter, sans-serif" font-size="26" font-weight="650" fill="#F06A42" opacity="1">AppIcon.icon</text><text x="862" y="428" font-family="Inter Display, Inter, sans-serif" font-size="22" font-weight="400" fill="#D6E2E8" opacity="1">Layered file-system package:</text><text x="862" y="480" font-family="Inter Display, Inter, sans-serif" font-size="22" font-weight="400" fill="#D6E2E8" opacity="1">icon.json + three editable SVG assets</text><text x="862" y="532" font-family="Inter Display, Inter, sans-serif" font-size="22" font-weight="400" fill="#D6E2E8" opacity="1">Navy background is handled by Icon Composer</text><text x="862" y="584" font-family="Inter Display, Inter, sans-serif" font-size="22" font-weight="400" fill="#D6E2E8" opacity="1">No mask baked into the source layers</text><text x="862" y="636" font-family="Inter Display, Inter, sans-serif" font-size="22" font-weight="400" fill="#D6E2E8" opacity="1">Mac validation still required in Icon Composer</text><g transform="translate(1273 602) scale(0.125000)"><g transform="translate(512 512) scale(1.20) translate(-512 -512)"><path d="M470 201 L279 675 L470 675 Z" fill="#F4EEDF"/><path d="M506 206 C648 236 755 330 741 429 C728 541 626 614 506 614 Z" fill="#F4EEDF"/><path d="M281 737 H506 L474 800 H276 Q248 800 248 775 V763 Q248 737 281 737 Z" fill="#F06A42"/></g></g><path d="M88 833H1512" stroke="#DCE3E5" stroke-width="2"/><text x="88" y="869" font-family="Inter Display, Inter, sans-serif" font-size="16" font-weight="600" fill="#687887" opacity="1" letter-spacing="2.5">PORTSIDE  /  IDENTITY SYSTEM</text><text x="1512" y="869" font-family="Inter Display, Inter, sans-serif" font-size="16" font-weight="500" fill="#687887" opacity="1" letter-spacing="1.2" text-anchor="end">09 / 09</text></svg>