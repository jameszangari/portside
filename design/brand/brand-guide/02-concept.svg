<filter id="soft" x="-25%" y="-25%" width="170%" height="170%"><feGaussianBlur stdDeviation="10"/></filter></defs><rect width="1600" height="900" fill="#F8F6F1"/><text x="88" y="91" font-family="Inter Display, Inter, sans-serif" font-size="19" font-weight="600" fill="#F06A42" opacity="1" letter-spacing="3">01 / CONCEPT</text><text x="88" y="172" font-family="Inter Display, Inter, sans-serif" font-size="68" font-weight="650" fill="#132A3D" opacity="1" letter-spacing="-2">A sail. A P. A destination.</text><text x="90" y="222" font-family="Inter Display, Inter, sans-serif" font-size="24" font-weight="400" fill="#687887" opacity="1">A single emblem composed from three precise, purposeful shapes.</text><rect x="86" y="270" width="650" height="498" rx="24" fill="#EAECE9" stroke="none" stroke-width="1"/><g transform="translate(132 225) scale(0.541992)"><g transform="translate(512 512) scale(1.20) translate(-512 -512)"><path d="M470 201 L279 675 L470 675 Z" fill="#10283F"/><path d="M506 206 C648 236 755 330 741 429 C728 541 626 614 506 614 Z" fill="#10283F"/><path d="M281 737 H506 L474 800 H276 Q248 800 248 775 V763 Q248 737 281 737 Z" fill="#F06A42"/></g></g><path d="M674 371H806" stroke="#F06A42" stroke-width="2"/><circle cx="674" cy="371" r="6" fill="#F06A42"/><text x="837" y="364" font-family="Inter Display, Inter, sans-serif" font-size="29" font-weight="650" fill="#132A3D" opacity="1">01 — Forward sail</text><text x="837" y="401" font-family="Inter Display, Inter, sans-serif" font-size="21" font-weight="400" fill="#687887" opacity="1">A clean triangular plane establishes</text><text x="837" y="433" font-family="Inter Display, Inter, sans-serif" font-size="21" font-weight="400" fill="#687887" opacity="1">direction and momentum.</text><path d="M666 507H806" stroke="#F06A42" stroke-width="2"/><circle cx="666" cy="507" r="6" fill="#F06A42"/><text x="837" y="502" font-family="Inter Display, Inter, sans-serif" font-size="29" font-weight="650" fill="#132A3D" opacity="1">02 — Rounded sail</text><text x="837" y="539" font-family="Inter Display, Inter, sans-serif" font-size="21" font-weight="400" fill="#687887" opacity="1">The curved form quietly suggests</text><text x="837" y="571" font-family="Inter Display, Inter, sans-serif" font-size="21" font-weight="400" fill="#687887" opacity="1">the bowl of the letter P.</text><path d="M650 670H806" stroke="#F06A42" stroke-width="2"/><circle cx="650" cy="670" r="6" fill="#F06A42"/><text x="837" y="667" font-family="Inter Display, Inter, sans-serif" font-size="29" font-weight="650" fill="#132A3D" opacity="1">03 — Safety-orange hull</text><text x="837" y="705" font-family="Inter Display, Inter, sans-serif" font-size="21" font-weight="400" fill="#687887" opacity="1">One vivid accent grounds the vessel</text><text x="837" y="737" font-family="Inter Display, Inter, sans-serif" font-size="21" font-weight="400" fill="#687887" opacity="1">without unnecessary ornament.</text><path d="M88 833H1512" stroke="#DCE3E5" stroke-width="2"/><text x="88" y="869" font-family="Inter Display, Inter, sans-serif" font-size="16" font-weight="600" fill="#687887" opacity="1" letter-spacing="2.5">PORTSIDE  /  IDENTITY SYSTEM</text><text x="1512" y="869" font-family="Inter Display, Inter, sans-serif" font-size="16" font-weight="500" fill="#687887" opacity="1" letter-spacing="1.2" text-anchor="end">02 / 09</text></svg>