<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" width="440" height="290" role="img" aria-labelledby="t d">
  <title id="t">Agent status</title>
  <desc id="d">Coding agent progress shown three ways: a sailboat and count in the notch, a spinning widget ring, and dots on an app icon, over a list of sessions.</desc>
  <style>
    .card { fill: #EAF0F6; stroke: #10283F; stroke-opacity: .14; }
    .bar { fill: #FFFFFF; fill-opacity: .9; }
    .ink { fill: #10283F; }
    .soft { fill: #10283F; fill-opacity: .16; }
    .faint { fill: #10283F; fill-opacity: .07; }
    .panel { fill: #FFFFFF; stroke: #10283F; stroke-opacity: .14; }
    .notch { fill: #0B0F14; }
    .accent { fill: #F06A42; }
    .tint { fill: #F06A42; fill-opacity: .16; }
    .green { fill: #34C759; }
    .line { stroke: #10283F; stroke-opacity: .25; fill: none; }
    .aline { stroke: #F06A42; fill: none; }
    .dash { stroke: #10283F; stroke-opacity: .35; fill: none; stroke-dasharray: 4 4; }
    .light { fill: #F4EEDF; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", sans-serif; }
    .label { font-size: 17px; font-weight: 700; fill: #10283F; }
    .hint { font-size: 12.5px; font-weight: 500; fill: #10283F; fill-opacity: .6; }
    .t { font-size: 12px; font-weight: 600; fill: #10283F; }
    .tm { font-size: 11px; font-weight: 500; fill: #10283F; fill-opacity: .55; }
    .tl { font-size: 11px; font-weight: 600; fill: #F4EEDF; }
    .key { font: 600 11.5px ui-monospace, "SF Mono", Menlo, monospace; fill: #F06A42; }
    .big { font-size: 22px; font-weight: 700; fill: #10283F; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #13202E; stroke: #F4EEDF; stroke-opacity: .14; }
      .bar { fill: #1C2B3B; fill-opacity: 1; }
      .ink { fill: #F4EEDF; }
      .soft { fill: #F4EEDF; fill-opacity: .22; }
      .faint { fill: #F4EEDF; fill-opacity: .08; }
      .panel { fill: #1F3044; stroke: #F4EEDF; stroke-opacity: .14; }
      .line { stroke: #F4EEDF; stroke-opacity: .3; }
      .dash { stroke: #F4EEDF; stroke-opacity: .4; }
      .label, .t, .big { fill: #F4EEDF; }
      .hint, .tm { fill: #F4EEDF; }
    }
  </style>
  
  <rect class="card" x="1" y="1" width="438" height="288" rx="20"/>
  <rect class="notch" x="28" y="34" width="170" height="32" rx="16"/>
  <path class="light" d="M53 39 l0 12 l-7 0z"/><path class="light" d="M55 41 q6 5 6 10 l-6 0z" fill-opacity=".7"/><path class="accent" d="M44 53 h20 l-4 5 h-12z"/>
  <rect class="notch" x="80" y="34" width="70" height="32"/>
  <circle class="accent" cx="176" cy="50" r="9"/><text class="tl" x="176" y="54" text-anchor="middle">2</text>
  <text class="tm" x="28" y="86">Top Notch</text>
  <rect class="panel" x="224" y="28" width="64" height="44" rx="10"/>
  <circle cx="256" cy="50" r="12" fill="none" stroke="#F06A42" stroke-opacity=".2" stroke-width="3"/>
  <path d="M256 38 a12 12 0 0 1 12 12" fill="none" stroke="#F06A42" stroke-width="3" stroke-linecap="round"/>
  <circle class="accent" cx="282" cy="32" r="7"/><text class="tl" x="282" y="35.5" text-anchor="middle" font-size="9">2</text>
  <text class="tm" x="224" y="86">Dock widget</text>
  <rect class="soft" x="330" y="28" width="44" height="44" rx="11"/>
  <circle class="accent" cx="338" cy="36" r="2.6" fill-opacity="1.0"/>
  <circle class="accent" cx="345" cy="36" r="2.6" fill-opacity="0.7"/>
  <circle class="accent" cx="352" cy="36" r="2.6" fill-opacity="0.4"/>
  <text class="tm" x="330" y="86">Working dots</text>
  <rect class="panel" x="24" y="98" width="392" height="112" rx="12"/>
  <circle class="accent" cx="42" cy="116" r="5"/><text class="t" x="56" y="120">Claude Code</text>
  <text class="tm" x="170" y="120">portside</text><text class="tm" x="400" y="120" text-anchor="end">working</text>
  <circle class="green" cx="42" cy="141" r="5"/><text class="t" x="56" y="145">Codex</text>
  <text class="tm" x="170" y="145">api-server</text><text class="tm" x="400" y="145" text-anchor="end">done</text>
  <circle class="accent" cx="42" cy="166" r="5"/><text class="t" x="56" y="170">ChatGPT</text>
  <text class="tm" x="170" y="170">Trip plan</text><text class="tm" x="400" y="170" text-anchor="end">working</text>
  <circle class="accent" cx="42" cy="191" r="5"/><text class="t" x="56" y="195">OpenCode</text>
  <text class="tm" x="170" y="195">site</text><text class="tm" x="400" y="195" text-anchor="end">needs you</text>
  <text class="label" x="24" y="252">Agent status</text>
  <text class="hint" x="24" y="272">Every coding agent at a glance; click one to jump back to it</text>
</svg>
