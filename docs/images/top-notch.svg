<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" width="440" height="290" role="img" aria-labelledby="t d">
  <title id="t">Top Notch</title>
  <desc id="d">The notch opened into a shelf with tabs and a music card with album art, progress and controls.</desc>
  <style>
