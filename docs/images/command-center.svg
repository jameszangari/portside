<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" width="440" height="290" role="img" aria-labelledby="t d">
  <title id="t">Command Center</title>
  <desc id="d">A search panel with the query port 5173 showing a local server, a stop action, an app and a calculator result.</desc>
  <style>
    .card { fill: #EAF0F6; stroke: #10283F; stroke-opacity: .14; }
    .bar { fill: #FFFFFF; fill-opacity: .9; }
    .ink { fill: #10283F; }
    .soft { fill: #10283F; fill-opacity: .16; }
    .faint { fill: #10283F; fill-opacity: .07; }
    .panel { fill: #FFFFFF; stroke: #10283F; stroke-opacity: .14; }
    .notch { fill: #0B0F14; }
    .accent { fill: #F06A42; }
    .tint { fill: #F06A42; fill-opacity: .16; }
    .green { fill: #34C759; }
    .line { stroke: #10283F; stroke-opacity: .25; fill: none; }
    .aline { stroke: #F06A42; fill: none; }
    .dash { stroke: #10283F; stroke-opacity: .35; fill: none; stroke-dasharray: 4 4; }
    .light { fill: #F4EEDF; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", sans-serif; }
    .label { font-size: 17px; font-weight: 700; fill: #10283F; }
    .hint { font-size: 12.5px; font-weight: 500; fill: #10283F; fill-opacity: .6; }
    .t { font-size: 12px; font-weight: 600; fill: #10283F; }
    .tm { font-size: 11px; font-weight: 500; fill: #10283F; fill-opacity: .55; }
    .tl { font-size: 11px; font-weight: 600; fill: #F4EEDF; }
    .key { font: 600 11.5px ui-monospace, "SF Mono", Menlo, monospace; fill: #F06A42; }
    .big { font-size: 22px; font-weight: 700; fill: #10283F; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #13202E; stroke: #F4EEDF; stroke-opacity: .14; }
      .bar { fill: #1C2B3B; fill-opacity: 1; }
      .ink { fill: #F4EEDF; }
      .soft { fill: #F4EEDF; fill-opacity: .22; }
      .faint { fill: #F4EEDF; fill-opacity: .08; }
      .panel { fill: #1F3044; stroke: #F4EEDF; stroke-opacity: .14; }
      .line { stroke: #F4EEDF; stroke-opacity: .3; }
      .dash { stroke: #F4EEDF; stroke-opacity: .4; }
      .label, .t, .big { fill: #F4EEDF; }
      .hint, .tm { fill: #F4EEDF; }
    }
  </style>
  
  <rect class="card" x="1" y="1" width="438" height="288" rx="20"/>
  <rect class="panel" x="40" y="22" width="360" height="190" rx="16"/>
  <rect class="faint" x="54" y="36" width="332" height="34" rx="10"/>
  <circle cx="72" cy="53" r="6" fill="none" stroke="#F06A42" stroke-width="2"/><path d="M76.5 57.5 l4 4" stroke="#F06A42" stroke-width="2" stroke-linecap="round"/>
  <text class="t" x="88" y="58">port 5173</text><rect class="accent" x="146" y="44" width="1.5" height="18"/>
  <text class="key" x="376" y="57" text-anchor="end">⌥Space</text>
  <rect class="tint" x="54" y="80" width="332" height="30" rx="8"/>
  <rect class="ink" x="62" y="86" width="18" height="18" rx="4"/>
  <text class="t" x="90" y="94">localhost:5173</text><text class="tm" x="90" y="106">node · my-app</text>
  <text class="key" x="376" y="99" text-anchor="end">↩ Open</text>
  <rect class="soft" x="62" y="118" width="18" height="18" rx="4"/>
  <text class="t" x="90" y="126">Stop Server</text><text class="tm" x="90" y="138">Asks first, SIGTERM only</text>
  <rect class="soft" x="62" y="150" width="18" height="18" rx="4"/>
  <text class="t" x="90" y="158">Safari</text><text class="tm" x="90" y="170">Application</text>
  <rect class="soft" x="62" y="182" width="18" height="18" rx="4"/>
  <text class="t" x="90" y="190">2 + 2 = 4</text><text class="tm" x="90" y="202">Calculator, copy result</text>
  <text class="label" x="24" y="252">Command Center</text>
  <text class="hint" x="24" y="272">Apps, commands, files, snippets, servers, math, emoji</text>
</svg>
